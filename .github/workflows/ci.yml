name: Pipeline CI Bomberman

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main", "develop"]

jobs:
  qualite-serveur:
    runs-on: ubuntu-latest
    steps:
      - name: Récupération du code
        uses: actions/checkout@v4

      - name: Configuration Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Installation des dépendances Serveur
        working-directory: ./server
        run: npm install

      - name: Vérification du style (Linting)
        working-directory: ./server
        run: npm run lint

      - name: Exécution des tests unitaires avec couverture
        working-directory: ./server
        run: npm run test:coverage

      - name: Sauvegarde du rapport de couverture Serveur
        uses: actions/upload-artifact@v4
        with:
          name: coverage-server
          path: server/coverage/lcov.info

  qualite-client:
    runs-on: ubuntu-latest
    steps:
      - name: Récupération du code
        uses: actions/checkout@v4

      - name: Configuration Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Installation des dépendances Client
        working-directory: ./client
        run: npm install

      - name: Vérification du style (Linting)
        working-directory: ./client
        run: npm run lint

      - name: Exécution des tests unitaires avec couverture
        working-directory: ./client
        run: npm run test:coverage

      - name: Sauvegarde du rapport de couverture Client
        uses: actions/upload-artifact@v4
        with:
          name: coverage-client
          path: client/coverage/lcov.info

  analyse-sonarqube:
    name: Analyse SonarQube
    runs-on: ubuntu-latest
    needs: [qualite-serveur, qualite-client] # Attend la génération des rapports de couverture
    steps:
      - name: Récupération du code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Obligatoire pour que SonarQube analyse l'historique complet

      - name: Téléchargement du rapport de couverture Serveur
        uses: actions/download-artifact@v4
        with:
          name: coverage-server
          path: server/coverage

      - name: Téléchargement du rapport de couverture Client
        uses: actions/download-artifact@v4
        with:
          name: coverage-client
          path: client/coverage

      - name: Scan SonarCloud
        uses: SonarSource/sonarqube-scan-action@v5.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # Fourni automatiquement par GitHub
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }} # Le secret que tu as configuré

  build-docker-serveur:
    name: Build & Validation Docker Serveur
    runs-on: ubuntu-latest
    needs: [qualite-serveur] # Attend que la suite de tests serveur passe
    steps:
      - name: Récupération du code
        uses: actions/checkout@v4

      - name: Configuration de Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Construction de l'image Docker Serveur
        uses: docker/build-push-action@v5
        with:
          context: ./server
          file: ./server/Dockerfile
          push: false
          tags: bomberman-arena-server:latest

      - name: Validation du fichier docker-compose
        run: docker compose config

  build-tauri:
    name: Build des exécutables Tauri
    runs-on: ubuntu-22.04
    needs: [qualite-client] # Attend que les tests clients passent avant de build
    steps:
      - name: Checkout du dépôt
        uses: actions/checkout@v4

      - name: Configuration de Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Configuration de Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Installation des dépendances système (Ubuntu)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.0-dev libsoup2.4-dev build-essential curl wget file libssl-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Installation des dépendances du client
        working-directory: ./client
        run: npm ci

      - name: Build du projet web (Vite)
        working-directory: ./client
        run: npm run build

      - name: Initialisation manuelle de Tauri
        working-directory: ./client
        run: |
          npx @tauri-apps/cli@v1 init --ci
          sed -i 's/com.tauri.dev/com.bomberman.arena/g' src-tauri/tauri.conf.json

      - name: Génération de l'exécutable Tauri
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: ./client
