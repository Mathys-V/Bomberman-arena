# Clés SonarCloud
sonar.projectKey=Mathys-V_Bomberman-arena
sonar.organization=mathys-v

# Dossiers sources et tests à analyser
sonar.sources=client/src,server/src
sonar.tests=client,server
sonar.test.inclusions=**/*.test.ts,**/*.test.js

# Fichiers exclus de l'analyse globale
sonar.exclusions=**/node_modules/**, client/dist/**, server/dist/**, client/src/assets/**

sonar.sourceEncoding=UTF-8

# Rapports de couverture de tests (LCOV)
sonar.javascript.lcov.reportPaths=server/coverage/lcov.info,client/coverage/lcov.info

# Fichiers exclus du calcul de couverture (tests, assets, types et bootstrap graphique)
sonar.coverage.exclusions=**/*.test.ts,**/*.test.js,client/src/assets/**,client/src/main.ts,client/src/vite-env.d.ts
